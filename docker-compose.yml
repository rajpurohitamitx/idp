version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: industrial_guardian
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    ports: ["8001:8001"]
    environment:
      MODEL_BACKEND: heuristic

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      ai-service: { condition: service_started }
    ports: ["4000:4000"]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://guardian:change_me@postgres:5432/industrial_guardian?schema=public
      JWT_SECRET: replace-with-a-long-random-string-min-32-chars
      FRONTEND_URL: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8001
      IMAGE_STORAGE_PATH: /app/storage/images
      ALLOW_DEVICE_AUTO_REGISTER: "false"
      DEMO_MODE_ENABLED: "true"
      SEED_ADMIN_PASSWORD: Admin@12345
      SEED_SUPERVISOR_PASSWORD: Super@12345
      SEED_OPERATOR_PASSWORD: Oper@12345
    volumes: ["image_storage:/app/storage/images"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  pg_data:
  image_storage:
